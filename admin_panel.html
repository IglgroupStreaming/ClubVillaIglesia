<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Club Sportivo Iglesia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100">
    <script>
        if(!sessionStorage.getItem('adminAuth')) window.location.href = 'login_admin.html';
    </script>
    
    <nav class="bg-blue-800 text-white shadow-lg p-4">
        <div class="max-w-7xl mx-auto flex justify-between">
            <div class="flex items-center space-x-2">
                <i class="fas fa-shield-alt text-2xl"></i>
                <span class="font-bold text-xl">Panel de Administración</span>
            </div>
            <button onclick="cerrarSesion()" class="bg-red-600 px-3 py-1 rounded text-sm">
                <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
            </button>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto p-6">
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
            <h1 class="text-2xl font-bold">⚽ Club Sportivo Iglesia</h1>
            <p>Sistema de gestión de socios - <span class="text-green-600">✅ Modo Demo Activo</span></p>
        </div>

        <!-- Estadísticas -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-white p-4 rounded shadow border-l-4 border-blue-600"><div class="text-gray-500">Total Socios</div><div class="text-2xl font-bold" id="total">0</div></div>
            <div class="bg-white p-4 rounded shadow border-l-4 border-green-600"><div class="text-gray-500">Activos</div><div class="text-2xl font-bold text-green-600" id="activos">0</div></div>
            <div class="bg-white p-4 rounded shadow border-l-4 border-yellow-600"><div class="text-gray-500">Pendientes</div><div class="text-2xl font-bold text-yellow-600" id="pendientes">0</div></div>
            <div class="bg-white p-4 rounded shadow border-l-4 border-red-600"><div class="text-gray-500">Inactivos</div><div class="text-2xl font-bold text-red-600" id="inactivos">0</div></div>
        </div>

        <!-- Agregar socio -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
            <h2 class="text-xl font-bold mb-4"><i class="fas fa-user-plus"></i> Agregar Socio</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <input type="text" id="nombre" placeholder="Nombre" class="border p-2 rounded">
                <input type="email" id="email" placeholder="Email" class="border p-2 rounded">
                <input type="text" id="telefono" placeholder="Teléfono" class="border p-2 rounded">
            </div>
            <button onclick="agregarSocio()" class="mt-4 bg-green-600 text-white px-6 py-2 rounded">Registrar Socio</button>
            <div id="resultMsg" class="mt-2 text-sm"></div>
        </div>

        <!-- Tabla de socios -->
        <div class="bg-white rounded-lg shadow-lg overflow-hidden">
            <div class="bg-blue-600 text-white p-4"><h2 class="font-bold"><i class="fas fa-list"></i> Lista de Socios</h2></div>
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-gray-200"><tr><th class="p-3">ID</th><th>Nombre</th><th>Email</th><th>Teléfono</th><th>Estado</th><th>Acciones</th></tr></thead>
                    <tbody id="listaSocios"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let socios = JSON.parse(localStorage.getItem('sociosAdmin')) || [
            { id: 1001, nombre: "Juan Pérez", email: "juan@ejemplo.com", telefono: "2645123456", estado: "Activo" },
            { id: 1002, nombre: "María Gómez", email: "maria@ejemplo.com", telefono: "2645234567", estado: "Activo" },
            { id: 1003, nombre: "Carlos Rodríguez", email: "carlos@ejemplo.com", telefono: "2645345678", estado: "Suspendido" }
        ];
        
        function guardarSocios() { localStorage.setItem('sociosAdmin', JSON.stringify(socios)); actualizarTabla(); }
        
        function actualizarTabla() {
            const tbody = document.getElementById('listaSocios');
            tbody.innerHTML = '';
            let activos = 0, pendientes = 0, inactivos = 0;
            socios.forEach((s, i) => {
                if(s.estado === 'Activo') activos++;
                else if(s.estado === 'Suspendido') pendientes++;
                else inactivos++;
                tbody.innerHTML += `<tr class="border-b"><td class="p-3">${s.id}</td><td>${s.nombre}</td><td>${s.email}</td><td>${s.telefono}</td><td><select onchange="cambiarEstado(${i}, this.value)" class="border rounded px-2 py-1">${['Activo','Suspendido','Inactivo'].map(e => `<option ${s.estado===e?'selected':''}>${e}</option>`).join('')}</select></td><td><button onclick="eliminarSocio(${i})" class="text-red-600"><i class="fas fa-trash"></i></button></td></tr>`;
            });
            document.getElementById('total').innerHTML = socios.length;
            document.getElementById('activos').innerHTML = activos;
            document.getElementById('pendientes').innerHTML = pendientes;
            document.getElementById('inactivos').innerHTML = inactivos;
        }
        
        function agregarSocio() {
            const nombre = document.getElementById('nombre').value.trim();
            const email = document.getElementById('email').value.trim();
            const telefono = document.getElementById('telefono').value.trim();
            if(!nombre || !email) { document.getElementById('resultMsg').innerHTML = '<span class="text-red-600">Completar nombre y email</span>'; setTimeout(()=>document.getElementById('resultMsg').innerHTML='',2000); return; }
            const nuevoId = Math.max(...socios.map(s=>s.id), 1000) + 1;
            socios.push({ id: nuevoId, nombre, email, telefono, estado: "Activo" });
            guardarSocios();
            document.getElementById('nombre').value = ''; document.getElementById('email').value = ''; document.getElementById('telefono').value = '';
            document.getElementById('resultMsg').innerHTML = '<span class="text-green-600">✅ Socio agregado</span>';
            setTimeout(()=>document.getElementById('resultMsg').innerHTML='',2000);
        }
        
        function eliminarSocio(i) { if(confirm('¿Eliminar socio?')) { socios.splice(i,1); guardarSocios(); } }
        function cambiarEstado(i, estado) { socios[i].estado = estado; guardarSocios(); }
        function cerrarSesion() { sessionStorage.removeItem('adminAuth'); window.location.href = 'login_admin.html'; }
        
        actualizarTabla();
    </script>
</body>
</html>
