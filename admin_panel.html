<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Club Sportivo Iglesia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100">
    <script>
        if(!sessionStorage.getItem('adminAuth')) window.location.href = 'login_admin.html';
    </script>
    
    <nav class="bg-blue-800 text-white shadow-lg p-4">
        <div class="max-w-7xl mx-auto flex justify-between">
            <div class="flex items-center space-x-2">
                <i class="fas fa-shield-alt text-2xl"></i>
                <span class="font-bold text-xl">Panel de Administración</span>
            </div>
            <button onclick="cerrarSesion()" class="bg-red-600 px-3 py-1 rounded text-sm">
                <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
            </button>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto p-6">
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
            <h1 class="text-2xl font-bold">⚽ Club Sportivo Iglesia</h1>
            <p>Gestión de socios - <span id="statusSheet" class="text-yellow-600">⏳ Conectando a Google Sheets...</span></p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-white p-4 rounded shadow border-l-4 border-blue-600"><div class="text-gray-500">Total Socios</div><div class="text-2xl font-bold" id="total">0</div></div>
            <div class="bg-white p-4 rounded shadow border-l-4 border-green-600"><div class="text-gray-500">Activos</div><div class="text-2xl font-bold text-green-600" id="activos">0</div></div>
            <div class="bg-white p-4 rounded shadow border-l-4 border-yellow-600"><div class="text-gray-500">Suspendidos</div><div class="text-2xl font-bold text-yellow-600" id="suspendidos">0</div></div>
            <div class="bg-white p-4 rounded shadow border-l-4 border-red-600"><div class="text-gray-500">Inactivos</div><div class="text-2xl font-bold text-red-600" id="inactivos">0</div></div>
        </div>

        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
            <h2 class="text-xl font-bold mb-4"><i class="fas fa-user-plus"></i> Agregar Socio</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="text" id="nombre" placeholder="Nombre" class="border p-2 rounded">
                <input type="email" id="email" placeholder="Email" class="border p-2 rounded">
                <input type="text" id="telefono" placeholder="Teléfono" class="border p-2 rounded">
                <select id="estado" class="border p-2 rounded"><option>Activo</option><option>Suspendido</option><option>Inactivo</option></select>
            </div>
            <button onclick="agregarSocio()" class="mt-4 bg-green-600 text-white px-6 py-2 rounded">Registrar Socio</button>
            <div id="resultMsg" class="mt-2 text-sm"></div>
        </div>

        <div class="bg-white rounded-lg shadow-lg overflow-hidden">
            <div class="bg-blue-600 text-white p-4"><h2 class="font-bold"><i class="fas fa-list"></i> Lista de Socios (Google Sheets)</h2></div>
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-gray-200"><tr><th class="p-3">ID</th><th>Nombre</th><th>Email</th><th>Teléfono</th><th>Estado</th><th>Acciones</th></tr></thead>
                    <tbody id="listaSocios"><tr><td colspan="6" class="text-center p-4">Cargando datos desde Google Sheets...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbywqVvCGj6PMKsmqUItytEHSr_tC6nlLnSPMHlLIK1J-2hX2FuW2EpYXdAZgT8xP5JV/exec';
        let socios = [];
        
        async function cargarSocios() {
            const statusSpan = document.getElementById('statusSheet');
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getData&t=${Date.now()}`);
                const text = await response.text();
                const data = JSON.parse(text);
                
                if (data.success && data.data) {
                    socios = data.data;
                    statusSpan.innerHTML = '✅ Conectado a Google Sheets';
                    statusSpan.className = 'text-green-600';
                    actualizarTabla();
                } else {
                    throw new Error('No hay datos');
                }
            } catch (error) {
                console.error(error);
                statusSpan.innerHTML = '⚠️ Usando datos locales (sin conexión a Sheets)';
                statusSpan.className = 'text-yellow-600';
                socios = [
                    { rowIndex: 2, id: 1001, nombre: "Juan Pérez", email: "juan@ejemplo.com", telefono: "2645123456", estado: "Activo", fechaRegistro: "2024-01-15" },
                    { rowIndex: 3, id: 1002, nombre: "María Gómez", email: "maria@ejemplo.com", telefono: "2645234567", estado: "Activo", fechaRegistro: "2024-02-10" }
                ];
                actualizarTabla();
            }
        }
        
        function actualizarTabla() {
            const tbody = document.getElementById('listaSocios');
            tbody.innerHTML = '';
            let activos = 0, suspendidos = 0, inactivos = 0;
            
            socios.forEach((s, i) => {
                if(s.estado === 'Activo') activos++;
                else if(s.estado === 'Suspendido') suspendidos++;
                else if(s.estado === 'Inactivo') inactivos++;
                
                tbody.innerHTML += `<tr class="border-b hover:bg-gray-50">
                    <td class="p-3">${s.id || i+1}</td>
                    <td class="p-3 font-medium">${s.nombre}</td>
                    <td class="p-3">${s.email}</td>
                    <td class="p-3">${s.telefono || '-'}</td>
                    <td class="p-3">
                        <select onchange="cambiarEstado(${i}, this.value)" class="border rounded px-2 py-1 text-sm">
                            <option ${s.estado === 'Activo' ? 'selected' : ''}>Activo</option>
                            <option ${s.estado === 'Suspendido' ? 'selected' : ''}>Suspendido</option>
                            <option ${s.estado === 'Inactivo' ? 'selected' : ''}>Inactivo</option>
                        </select>
                    </td>
                    <td class="p-3"><button onclick="eliminarSocio(${i})" class="text-red-600 hover:text-red-800"><i class="fas fa-trash"></i></button></td>
                </tr>`;
            });
            
            document.getElementById('total').innerHTML = socios.length;
            document.getElementById('activos').innerHTML = activos;
            document.getElementById('suspendidos').innerHTML = suspendidos;
            document.getElementById('inactivos').innerHTML = inactivos;
        }
        
        async function agregarSocio() {
            const nombre = document.getElementById('nombre').value.trim();
            const email = document.getElementById('email').value.trim();
            const telefono = document.getElementById('telefono').value.trim();
            const estado = document.getElementById('estado').value;
            const resultMsg = document.getElementById('resultMsg');
            
            if(!nombre || !email) {
                resultMsg.innerHTML = '<span class="text-red-600">❌ Completar nombre y email</span>';
                setTimeout(()=>resultMsg.innerHTML='',2000);
                return;
            }
            
            resultMsg.innerHTML = '<span class="text-blue-600">⏳ Enviando a Google Sheets...</span>';
            
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: new URLSearchParams({ action: 'addData', nombre, email, telefono, estado })
                });
                
                resultMsg.innerHTML = '<span class="text-green-600">✅ Socio agregado correctamente</span>';
                document.getElementById('nombre').value = '';
                document.getElementById('email').value = '';
                document.getElementById('telefono').value = '';
                setTimeout(() => { cargarSocios(); resultMsg.innerHTML = ''; }, 1000);
            } catch(error) {
                resultMsg.innerHTML = '<span class="text-red-600">❌ Error al agregar</span>';
            }
        }
        
        async function eliminarSocio(index) {
            const socio = socios[index];
            if(!confirm(`¿Eliminar a ${socio.nombre}?`)) return;
            
            if(socio.rowIndex) {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: new URLSearchParams({ action: 'deleteData', rowIndex: socio.rowIndex })
                });
            }
            cargarSocios();
        }
        
        async function cambiarEstado(index, nuevoEstado) {
            const socio = socios[index];
            if(socio.rowIndex) {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: new URLSearchParams({ action: 'updateData', rowIndex: socio.rowIndex, estado: nuevoEstado })
                });
            }
            cargarSocios();
        }
        
        function cerrarSesion() {
            sessionStorage.removeItem('adminAuth');
            window.location.href = 'login_admin.html';
        }
        
        cargarSocios();
    </script>
</body>
</html>
