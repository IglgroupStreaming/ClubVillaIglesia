<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administración - Club Sportivo Iglesia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-blue-50 to-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-lg shadow-xl p-8 max-w-md w-full">
        <div class="text-center mb-6">
            <div class="bg-blue-800 text-white p-4 rounded-full w-20 h-20 flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-shield-alt text-3xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-800">Panel de Administración</h2>
            <p class="text-gray-600 mt-2">Ingrese sus credenciales</p>
        </div>
        
        <div id="errorMsg" class="mb-4 p-3 bg-red-100 text-red-700 rounded-lg text-sm hidden"></div>
        
        <form onsubmit="return false;">
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold mb-2">👤 Usuario</label>
                <input type="text" id="adminUser" class="w-full border p-3 rounded-lg">
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 font-semibold mb-2">🔒 Contraseña</label>
                <input type="password" id="adminPass" class="w-full border p-3 rounded-lg">
            </div>
            <button onclick="verificarLogin()" class="w-full bg-blue-600 text-white p-3 rounded-lg hover:bg-blue-700">
                <i class="fas fa-sign-in-alt"></i> Ingresar
            </button>
        </form>
        
        <div class="mt-6 text-center text-sm text-gray-500">
            <a href="index.html" class="text-blue-600 hover:underline">← Volver al inicio</a>
        </div>
    </div>

    <script>
        function verificarLogin() {
            const user = document.getElementById('adminUser').value;
            const pass = document.getElementById('adminPass').value;
            const error = document.getElementById('errorMsg');
            
            if(user === 'admin' && pass === 'ClubIglesia2024') {
                sessionStorage.setItem('adminAuth', 'true');
                window.location.href = 'admin_panel.html';
            } else {
                error.innerHTML = '❌ Usuario o contraseña incorrectos';
                error.classList.remove('hidden');
                setTimeout(() => error.classList.add('hidden'), 3000);
            }
        }
    </script>
</body>
</html>
